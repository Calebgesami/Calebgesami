name: Generate Trophy SVG

on:
  schedule:
    - cron: '0 0 * * *' # Runs once a day, you can change it yourself
  workflow_dispatch: # Allows manual triggering

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Calebgesami
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          # You can add other parameters supported by the original project here, such as theme
          # theme: darkhub

      - name: Commit and Push
        run: |
          git config user.name "Calebgesami"
          git config user.email "calebgesami@gmail.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: update trophy"
          git push
